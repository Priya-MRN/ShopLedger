<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">ShopLedger browser UI, Express server, routers, libraries, configuration and JSON data, with numbered order placement flow. Ticket modules are highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="flowarrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#475569}
      .section{font-size:15px;font-weight:700;fill:#334155}
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;rx:10}
      .ticket{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
      .data{fill:#ecfdf5;stroke:#059669;stroke-width:1.8}
      .head{font-size:16px;font-weight:700}.small{font-size:12px;fill:#475569}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#flowarrow)}
      .edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
      .legend{font-size:12px;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="32" y="42" class="title">ShopLedger · application architecture</text>
  <text x="32" y="66" class="subtitle">Node / Express POS, Khata ledger and GST invoicing · order placement flow numbered 1–8</text>

  <!-- Main request path -->
  <rect x="30" y="96" width="205" height="126" class="box"/>
  <text x="48" y="124" class="head">Browser UI · public/</text>
  <text x="48" y="148" class="small">index.html · css/style.css</text>
  <text x="48" y="168" class="small">js/app.js · POS cart</text>
  <text x="48" y="190" class="small">POST /api/orders</text>

  <rect x="290" y="96" width="205" height="126" class="box"/>
  <text x="308" y="124" class="head">server.js</text>
  <text x="308" y="148" class="small">Express + JSON body parser</text>
  <text x="308" y="168" class="small">Serves public/ and mounts</text>
  <text x="308" y="188" class="small">all routers at /api</text>

  <rect x="550" y="96" width="260" height="126" class="box"/>
  <text x="568" y="124" class="head">routes/orders.js</text>
  <text x="568" y="148" class="small">POST /orders · validates cart</text>
  <text x="568" y="168" class="small">Coordinates inventory, totals,</text>
  <text x="568" y="188" class="small">Khata, order and persistence</text>

  <path d="M235 159 H286" class="flow"/><circle cx="260" cy="148" r="13" class="num"/><text x="260" y="152" class="numtext">1</text>
  <path d="M495 159 H546" class="flow"/><circle cx="520" cy="148" r="13" class="num"/><text x="520" y="152" class="numtext">2</text>

  <!-- Libraries -->
  <text x="30" y="270" class="section">Business modules · lib/</text>
  <rect x="30" y="286" width="216" height="104" class="box"/>
  <text x="46" y="314" class="head">lib/inventory.js</text>
  <text x="46" y="338" class="small">find · check · reserve</text>
  <text x="46" y="358" class="small">sellable stock</text>

  <rect x="266" y="286" width="216" height="104" class="box"/>
  <text x="282" y="314" class="head">lib/pricing.js</text>
  <text x="282" y="338" class="small">subtotal · computeTotals</text>
  <text x="282" y="358" class="small">GST from tax.js</text>

  <rect x="502" y="286" width="216" height="104" class="ticket"/>
  <text x="518" y="314" class="head">lib/orders.js</text>
  <text x="518" y="338" class="small">add · get · cancel · list</text>
  <text x="518" y="358" class="small">ticket focus: list()</text>

  <rect x="738" y="286" width="216" height="104" class="ticket"/>
  <text x="754" y="314" class="head">lib/dates.js</text>
  <text x="754" y="338" class="small">today · normalizeDateKey</text>
  <text x="754" y="358" class="small">getFiscalYear</text>

  <rect x="974" y="286" width="196" height="104" class="ticket"/>
  <text x="990" y="314" class="head">lib/ledger.js</text>
  <text x="990" y="338" class="small">chargeOrderToKhata</text>
  <text x="990" y="358" class="small">recordSettlement</text>

  <!-- Supporting modules -->
  <rect x="30" y="416" width="216" height="92" class="box"/>
  <text x="46" y="444" class="head">lib/coupons.js</text>
  <text x="46" y="468" class="small">normalizeCode · validate</text>
  <text x="46" y="488" class="small">calculateDiscount</text>

  <rect x="266" y="416" width="216" height="92" class="box"/>
  <text x="282" y="444" class="head">lib/tax.js</text>
  <text x="282" y="468" class="small">HSN rates · CGST / SGST</text>

  <rect x="502" y="416" width="216" height="92" class="box"/>
  <text x="518" y="444" class="head">lib/store.js</text>
  <text x="518" y="468" class="small">read · write · appendAudit</text>

  <rect x="738" y="416" width="216" height="92" class="box"/>
  <text x="754" y="444" class="head">lib/invoice.js</text>
  <text x="754" y="468" class="small">computeInvoiceFigures · render</text>

  <rect x="974" y="416" width="196" height="92" class="box"/>
  <text x="990" y="444" class="head">lib/reports.js</text>
  <text x="990" y="468" class="small">dashboard · GST reconciliation</text>

  <!-- More routers and data -->
  <rect x="30" y="544" width="216" height="84" class="box"/>
  <text x="46" y="572" class="head">routes/products.js</text>
  <text x="46" y="596" class="small">GET /products · /coupons</text>
  <rect x="266" y="544" width="216" height="84" class="ticket"/>
  <text x="282" y="572" class="head">routes/customers.js</text>
  <text x="282" y="596" class="small">GET /customers · POST /settle</text>
  <rect x="502" y="544" width="216" height="84" class="box"/>
  <text x="518" y="572" class="head">routes/reports.js</text>
  <text x="518" y="596" class="small">dashboard · preview · export</text>
  <rect x="738" y="544" width="216" height="84" class="box"/>
  <text x="754" y="572" class="head">config.js</text>
  <text x="754" y="596" class="small">port · shop · tax · coupons</text>
  <rect x="974" y="544" width="196" height="84" class="data"/>
  <text x="990" y="572" class="head">data/db.json</text>
  <text x="990" y="596" class="small">products · orders · customers</text>

  <!-- Numbered order sequence across the modules -->
  <path d="M680 222 V258 H138 V282" class="flow"/><circle cx="650" cy="258" r="13" class="num"/><text x="650" y="262" class="numtext">3</text>
  <path d="M246 338 H262" class="flow"/><circle cx="254" cy="324" r="13" class="num"/><text x="254" y="328" class="numtext">4</text>
  <path d="M482 338 H498" class="flow"/><circle cx="490" cy="324" r="13" class="num"/><text x="490" y="328" class="numtext">5</text>
  <path d="M718 338 H734" class="flow"/><circle cx="726" cy="324" r="13" class="num"/><text x="726" y="328" class="numtext">6</text>
  <path d="M954 338 H970" class="flow"/><circle cx="962" cy="324" r="13" class="num"/><text x="962" y="328" class="numtext">7</text>
  <path d="M610 390 V412" class="flow"/><circle cx="630" cy="402" r="13" class="num"/><text x="630" y="406" class="numtext">8</text>

  <!-- Relationships to shared modules and data -->
  <path d="M600 222 V270 H138 V412" class="edge"/>
  <path d="M655 222 V264 H374 V412" class="edge"/>
  <path d="M712 222 V252 H1070 V282" class="edge"/>
  <path d="M810 338 H950 V460 H970" class="edge"/>
  <path d="M874 390 V530 H390 V540" class="edge"/>
  <path d="M610 508 V530 H1070 V540" class="edge"/>
  <path d="M846 508 V530 H846 V540" class="edge"/>

  <!-- Flow key and legend -->
  <rect x="30" y="654" width="1140" height="116" fill="#f8fafc" stroke="#cbd5e1" rx="10"/>
  <text x="50" y="681" class="section">Order placement flow</text>
  <text x="50" y="706" class="legend">1 Browser sends cart → 2 server.js routes request → 3 routes/orders.js validates and coordinates → 4 inventory.find / check → 5 pricing.subtotal / computeTotals + coupons.validate</text>
  <text x="50" y="728" class="legend">6 ledger.chargeOrderToKhata when Khata → 7 inventory.reserve → 8 orders.add (dates.today) → store.appendAudit / write → data/db.json</text>
  <rect x="50" y="744" width="18" height="14" class="ticket"/><text x="76" y="756" class="legend">Ticket modules: lib/orders.js (list focus), lib/dates.js, lib/ledger.js, routes/customers.js</text>
  <rect x="718" y="744" width="18" height="14" class="data"/><text x="744" y="756" class="legend">Persistent JSON data</text>
  <line x1="910" y1="751" x2="952" y2="751" class="flow"/><text x="966" y="756" class="legend">Numbered request / save flow</text>
</svg>
